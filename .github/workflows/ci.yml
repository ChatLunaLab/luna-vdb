name: CI

# Every build runs here. Nothing is compiled on a developer machine — the
# wasm32 target, the SIMD-flag build, the browser tests and the native tests all
# need a toolchain that is easier to pin in CI than to reproduce per laptop.
#
# The same steps run on the internal build host via `scripts/remote-build.sh`,
# for when you want a result without waiting on a runner.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail on the first warning; the crate is warning-clean and should stay so.
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Native: the engine is pure Rust, so most correctness lives here.
  # ---------------------------------------------------------------------------
  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Pinned, not `stable`. CI is the only place this crate is built, so a
      # toolchain that floats means the lint set can change under a pull request
      # that touched nothing — which is exactly how `chunks_exact_to_as_chunks`
      # first appeared, as 13 errors on a branch that compiled clean on the
      # pinned build host. Bump this deliberately, together with the container
      # tag in `scripts/remote-build.sh`, so the two never disagree.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Unit + integration tests
        run: cargo test --all-features --verbose

      - name: Benchmarks compile
        run: cargo bench --no-run --bench search

  # ---------------------------------------------------------------------------
  # wasm32, scalar: the baseline that must run on every runtime, including ones
  # without SIMD support.
  #
  # Each wasm job builds into its own `CARGO_TARGET_DIR`. Sharing the default
  # path would let the SIMD job's artifact overwrite the scalar job's, and the
  # opcode assertions below would then be checking the wrong file — the check
  # would pass by accident for exactly the bug it exists to catch.
  # ---------------------------------------------------------------------------
  wasm-scalar:
    name: wasm32 (scalar)
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target/scalar
      RUSTFLAGS: -D warnings -C target-feature=-simd128
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (wasm32)
        run: cargo clippy --target wasm32-unknown-unknown --all-features -- -D warnings

      - name: Build (wasm32)
        run: cargo build --release --target wasm32-unknown-unknown --all-features

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: wasm-pack test (node)
        run: wasm-pack test --node -- --features console_error_panic_hook

      - name: Verify the module is SIMD-free
        # A scalar artifact must not contain SIMD128 opcodes, or a runtime
        # without them will refuse to instantiate it.
        run: |
          cargo install wasm-tools --locked
          wasm-tools print "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/luna_vdb.wasm" > module.wat
          if grep -qE 'f32x4\.(add|mul|sub)|v128\.load' module.wat; then
            echo "::error::scalar build contains SIMD128 instructions"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # wasm32 + SIMD128: the fast path, and the one the browser tests exercise.
  # ---------------------------------------------------------------------------
  wasm-simd:
    name: wasm32 (simd128)
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target/simd
      RUSTFLAGS: -D warnings -C target-feature=+simd128
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (wasm32 + simd128)
        run: cargo clippy --target wasm32-unknown-unknown --all-features -- -D warnings

      - name: Build (wasm32 + simd128)
        run: cargo build --release --target wasm32-unknown-unknown --all-features

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: wasm-pack test (node)
        run: wasm-pack test --node -- --features console_error_panic_hook

      - name: wasm-pack test (headless chrome)
        run: wasm-pack test --headless --chrome -- --features console_error_panic_hook

      - name: Verify the SIMD section is present
        # The mirror of the scalar check: this build must contain vector
        # instructions at all. On its own it cannot prove the hand-written
        # kernels are linked in — at opt-level 3 with +simd128, LLVM
        # autovectorises ordinary loops elsewhere into the same opcodes. The
        # check that the SIMD *kernels* are in use is `test_simd_backend_is_known`
        # in the wasm suite above: the backend name comes from the kernel module
        # that is compiled in, and must be "wasm-simd128" in this job.
        run: |
          cargo install wasm-tools --locked
          wasm-tools print "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/luna_vdb.wasm" > module.wat
          if ! grep -qE 'f32x4\.(add|mul|sub)' module.wat; then
            echo "::error::simd128 build has no vector instructions — the kernel is not being used"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Legacy import: snapshots written by the real pre-rewrite engine (commit
  # ca10590, linked as a second dependency) must load and answer correctly.
  # The codec's unit tests only prove the decoder agrees with a hand-copied
  # mirror of the old structs; this proves the mirror agrees with reality.
  # ---------------------------------------------------------------------------
  legacy-import:
    name: Legacy snapshot import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compare

      - name: Import snapshots written by the pre-rewrite engine
        run: cargo test --release --manifest-path compare/Cargo.toml

  # ---------------------------------------------------------------------------
  # Package: build the published artifacts and run the JS-level smoke tests
  # against them.
  # ---------------------------------------------------------------------------
  package:
    name: Package smoke test
    runs-on: ubuntu-latest
    needs: [wasm-scalar, wasm-simd]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `scripts/build.sh` drives both `wasm-bindgen` and `wasm-opt` directly,
      # so this job needs the CLIs themselves — `wasm-pack` alone is not enough.
      # The `wasm-bindgen-cli` version must match the `wasm-bindgen` crate
      # exactly, or the generated glue is rejected at runtime; the lockfile is
      # the source of truth for that number. Bump the two together.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack,wasm-bindgen-cli@0.2.129

      # `wasm-opt` comes from binaryen and is not on crates.io — `cargo install
      # wasm-opt` fails. `scripts/build.sh` treats it as optional, so the
      # package still builds without it; the release tarball below is the cheap
      # way to get it in the common case. Bump the tag deliberately: these are
      # not stable URLs, and a wrong one 404s the step.
      #
      # The tarball unpacks to `binaryen-<tag>/bin`, not `bin/` at the root.
      # `$GITHUB_PATH` only affects *subsequent* steps, so the version check
      # here has to export PATH itself — writing to `$GITHUB_PATH` and then
      # calling `wasm-opt` in the same step fails with "command not found".
      - name: Install wasm-opt (binaryen)
        env:
          BINARYEN_VERSION: version_133
        run: |
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | tar xz -C /tmp
          BINARYEN_BIN="/tmp/binaryen-${BINARYEN_VERSION}/bin"
          echo "$BINARYEN_BIN" >> "$GITHUB_PATH"
          "$BINARYEN_BIN/wasm-opt" --version

      - name: Build both packages
        run: ./scripts/build.sh

      - name: Install JS deps
        run: corepack enable && yarn install --immutable

      - name: Smoke test the node build
        run: node tests/js/smoke.mjs

      - name: Smoke test the browser bundle (scalar fallback path)
        run: node tests/js/smoke-browser.mjs

      # The opcode assertions live here rather than in the JS smoke test,
      # because they need a real decoder.
      #
      # `tests/js/smoke-browser.mjs` used to scan for the `0xFD` prefix itself.
      # That cannot distinguish an instruction from an immediate operand, and it
      # reported 26 "SIMD opcode candidates" in a scalar artifact that contains
      # zero vector instructions — the bytes were inside LEB128 constants and
      # float literals. `wasm-tools print` is the correct tool.
      #
      # This checks the *packaged* artifact, which is what actually ships. The
      # wasm-scalar and wasm-simd jobs check the intermediate cargo output.
      - name: Verify packaged artifacts' SIMD content
        run: |
          cargo install wasm-tools --locked

          for artifact in web-scalar nodejs-scalar; do
            wasm-tools print "pkg/$artifact/luna_vdb_bg.wasm" > /tmp/scalar.wat
            if grep -qE 'f32x4\.(add|mul|sub)' /tmp/scalar.wat; then
              echo "::error::$artifact contains SIMD instructions; it must not"
              exit 1
            fi
            echo "$artifact: clean"
          done

          for artifact in web nodejs; do
            wasm-tools print "pkg/$artifact/luna_vdb_bg.wasm" > /tmp/simd.wat
            if ! grep -qE 'f32x4\.(add|mul|sub)' /tmp/simd.wat; then
              echo "::error::$artifact has no SIMD instructions; the kernel is not in use"
              exit 1
            fi
            echo "$artifact: $(grep -cE 'f32x4\.(add|mul|sub)' /tmp/simd.wat) vector ops"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: pkg
          path: pkg/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Benchmark: informational, not a gate. It exists so a performance claim in a
  # PR can be checked against a number rather than an opinion.
  # ---------------------------------------------------------------------------
  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@v2

      - name: Run benchmark
        run: |
          set -o pipefail
          cargo bench --bench search 2>&1 | tee bench.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench.txt

  # ---------------------------------------------------------------------------
  # Compare: the rewritten engine against the last pre-rewrite commit, in one
  # process on identical data. This is the number behind any "N× faster" claim.
  # Informational, not a gate — the runner is shared hardware.
  # ---------------------------------------------------------------------------
  compare:
    name: Compare with pre-rewrite engine
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compare

      - name: Run comparison
        # `pipefail`: the default runner shell is `bash -e` without it, so a
        # failed build piped through `tee` would otherwise report success.
        run: |
          set -o pipefail
          cargo run --release --manifest-path compare/Cargo.toml --bin luna-vdb-legacy-compare 2>&1 | tee compare.txt

      # Recall/latency curves across `nprobe`, on clustered and uniform data.
      # The uniform set is the worst case for any partitioning index; the
      # clustered one is closer to real embeddings. Defaults should be chosen
      # from this table, not from a single speed number.
      - name: Run recall sweep
        run: |
          set -o pipefail
          cargo run --release --manifest-path compare/Cargo.toml --bin sweep 2>&1 | tee -a compare.txt

      - name: Publish to the job summary
        if: always()
        run: |
          {
            echo '## Rewritten engine vs pre-rewrite (ca10590)'
            echo '```'
            cat compare.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: compare-results
          path: compare.txt
