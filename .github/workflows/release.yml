name: Release

# Publishes the npm package and the crate when a version tag is pushed:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The tag must equal the version in both `Cargo.toml` and `package.json`
# (with a leading `v`). The whole CI workflow runs first, and the npm package
# is the `pkg` artifact that run built and smoke-tested — not a second build.
#
# Credentials:
#
# * npm uses trusted publishing (OIDC); there is no token. Configure it once on
#   npmjs.com → @chatluna/luna-vdb → Settings → Trusted publisher → GitHub
#   Actions: organization `ChatLunaLab`, repository `luna-vdb`, workflow
#   filename `release.yml`, environment `npm`, and leave "allow npm publish"
#   unchecked. The job runs `npm stage publish`, so a release lands in the
#   package's Staged Packages tab and goes live only when a maintainer approves
#   it there with 2FA (or with `npm stage approve <stage-id>`). CI alone can
#   never put a version live.
# * crates.io reads `CARGO_REGISTRY_TOKEN` from the `crates-io` environment.
#
# Both environments only accept `v*` tags, so a branch run can never reach
# either credential.
#
# Each half can be re-run on its own: a version already on the registry (or
# already staged on npm) is skipped instead of failing the job. A version with
# a pre-release suffix (`1.1.0-beta.1`) goes to npm under the `next` dist-tag,
# not `latest`.

on:
  push:
    tags: ['v*']
  # For re-running a release: pick the tag under "Use workflow from".
  workflow_dispatch:

permissions:
  contents: read

# Not `${{ github.workflow }}-${{ github.ref }}`: that is the group the called
# CI workflow computes for itself, and a caller and callee sharing a group
# deadlock.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      npm-tag: ${{ steps.check.outputs.npm-tag }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::Release runs from a tag (v1.2.3), not from $GITHUB_REF"
            exit 1
          fi

          tag="${GITHUB_REF_NAME#v}"
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          npm=$(node -p "require('./package.json').version")

          echo "tag $tag, Cargo.toml $crate, package.json $npm"
          if [ "$tag" != "$crate" ] || [ "$tag" != "$npm" ]; then
            echo "::error::Tag v$tag does not match Cargo.toml ($crate) and package.json ($npm)"
            exit 1
          fi

          echo "version=$tag" >> "$GITHUB_OUTPUT"
          case "$tag" in
            *-*) echo "npm-tag=next" >> "$GITHUB_OUTPUT" ;;
            *) echo "npm-tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml

  npm:
    name: Publish to npm
    needs: [version, ci]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # Trusted publishing exchanges this OIDC token for a short-lived npm
      # credential, and signs the provenance statement with it.
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # `npm stage publish` needs npm 11.15.0 or later.
      - run: npm install -g npm@latest && npm --version

      - uses: actions/download-artifact@v4
        with:
          name: pkg
          path: pkg

      - id: published
        name: Check whether this version is already on npm
        run: |
          if npm view "@chatluna/luna-vdb@$VERSION" version >/dev/null 2>&1; then
            echo "@chatluna/luna-vdb@$VERSION is already published; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: List package contents
        run: npm pack --dry-run

      # Staged and published versions share one version index, so a re-run
      # after a successful stage is refused as a duplicate; that is the state
      # we want, not a failure. `npm stage list` would tell the two apart, but
      # it needs interactive 2FA and cannot run on an OIDC token.
      - if: steps.published.outputs.skip != 'true'
        env:
          NPM_TAG: ${{ needs.version.outputs.npm-tag }}
        run: |
          set +e
          npm stage publish --access public --tag "$NPM_TAG" 2>&1 | tee /tmp/stage.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            if grep -qiE 'already (exists|staged|published)|cannot publish over|previously published' /tmp/stage.log; then
              echo "::notice::@chatluna/luna-vdb@$VERSION is already staged; approve the existing stage"
            else
              exit "$status"
            fi
          fi
          {
            echo "## @chatluna/luna-vdb@$VERSION is staged on npm (dist-tag \`$NPM_TAG\`)"
            echo
            echo "It is not live yet. Approve it with 2FA:"
            echo
            echo "- npmjs.com → @chatluna/luna-vdb → **Staged Packages** → **Approve**, or"
            echo "- \`npm stage list @chatluna/luna-vdb\`, then \`npm stage approve <stage-id>\`"
          } >> "$GITHUB_STEP_SUMMARY"

  crates:
    name: Publish to crates.io
    needs: [version, ci]
    runs-on: ubuntu-latest
    environment: crates-io
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0

      - uses: Swatinem/rust-cache@v2

      - id: published
        name: Check whether this version is already on crates.io
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A 'luna-vdb release (https://github.com/ChatLunaLab/luna-vdb)' \
            "https://crates.io/api/v1/crates/luna-vdb/$VERSION")
          if [ "$status" = 200 ]; then
            echo "luna-vdb $VERSION is already published; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: List package contents
        run: cargo package --list --locked

      - if: steps.published.outputs.skip != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
