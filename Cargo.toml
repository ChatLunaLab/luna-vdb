[package]
name = "luna-vdb"
version = "1.0.0"
authors = ["dingyi <dingyi222666@foxmail.com>"]
edition = "2024"
description = "Lightweight local vector database: IVF search with SIMD kernels, for native Rust and WebAssembly (Node.js and the browser)"
license = "MIT"
repository = "https://github.com/ChatLunaLab/luna-vdb"
homepage = "https://github.com/ChatLunaLab/luna-vdb"
readme = "README.md"
keywords = ["vector-database", "embeddings", "ann", "wasm", "simd"]
categories = ["database-implementations", "algorithms", "wasm", "science"]
# The toolchain CI pins and tests; edition 2024 and `<[T]>::as_chunks` need
# at least 1.88.
rust-version = "1.90"
# Only what a Rust user needs. The JS packaging, benchmarks against the old
# engine, CI and charts stay in the repository.
include = [
    "/src/**",
    "/benches/**",
    "/examples/**",
    "/tests/**/*.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]
# Enables `wasm_simd` on wasm32 builds. This must be enabled at *build* time
# via `RUSTFLAGS="-C target-feature=+simd128"`; see scripts/build.sh.
console_error_panic_hook = ["dep:console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2.104"
serde = { version = "1.0.217", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
tsify = { version = "0.4.5", features = ["js"] }
bytemuck = { version = "1.21", features = ["derive"] }
# Only used to read snapshots written by luna-vdb <= 0.0.12 (gzip + bincode v1).
flate2 = "1.0.35"
bincode = "1.3.3"
console_error_panic_hook = { version = "0.1.7", optional = true }

# `js-sys` is only reachable from the wasm bindings. Scoping it to the wasm32
# target keeps the native test build free of a crate that assumes a JS host.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.77"

[dev-dependencies]
wasm-bindgen-test = "0.3.45"
web-sys = { version = "0.3.77", features = ["console"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Note: no `panic = "abort"`. The engine has no panic path on user input
# (clippy's `unwrap_used`/`panic` lints are denied in `lib.rs`), so unwinding
# tables cost nothing at runtime, and keeping them lets `cargo test --release`
# report a failed assertion instead of aborting the whole binary.
#
# `wasm32-unknown-unknown` does not support `panic = "unwind"` at all, so this
# line must stay omitted — setting it explicitly is a hard error for wasm builds.
debug = false
strip = true

[profile.dev]
opt-level = 1
debug = true
debug-assertions = true

# `cargo bench` needs real optimisations even though it uses the `bench`
# profile; inherit release and keep symbols so profiles are readable.
[profile.bench]
inherits = "release"
debug = true
strip = false

[package.metadata.wasm-pack.profile.release]
# Must stay in step with `COMMON_FEATURES` in `scripts/build.sh`. The
# `--enable-*` flags are validation flags: they widen what wasm-opt will accept,
# and binaryen's default set is narrower than what rustc emits for
# `wasm32-unknown-unknown`. `--enable-nontrapping-float-to-int` covers
# `i32.trunc_sat_f32_u`, which every float-to-integer `as` cast lowers to;
# without it wasm-opt fails with "all used features should be allowed".
wasm-opt = [
    "-O4",
    "--enable-simd",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-reference-types",
    "--enable-multivalue",
    "--enable-sign-ext",
    "--enable-mutable-globals",
]

[package.metadata.wasm-pack]
skip-pkg-json = true

[package.metadata.wasm-pack.profile.dev.wasm-bindgen]
dwarf-debug-info = true

[[bench]]
name = "search"
harness = false
